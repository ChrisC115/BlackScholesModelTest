<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Alpaca Live Data</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 10px;
    }

    pre {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      overflow-x: auto;
    }
  </style>
</head>

<body>
  <h1>Live Alpaca Positions</h1>
  <pre id="positions">Loading...</pre>

  <h1>Account Info</h1>
  <pre id="account">Loading...</pre>

  <script>
    async function updateData() {
      try {
        const positions = await fetch("http://127.0.0.1:5000/positions");
        const positionsData = await positions.json();

        const account = await fetch("http://127.0.0.1:5000/account");
        const accountData = await account.json();

        document.getElementById("positions").textContent =
          JSON.stringify(positionsData, null, 2);

        document.getElementById("account").textContent =
          JSON.stringify(accountData, null, 2);

      } catch (error) {
        document.getElementById("positions").textContent = "Error loading data";
        document.getElementById("account").textContent = "Error loading data";
      }
    }

    updateData();           // load once
    setInterval(updateData, 2000);   // refresh every 2 seconds
  </script>

</body>
</html>
